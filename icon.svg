<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e0a35"/>
      <stop offset="100%" stop-color="#0d0d14"/>
    </linearGradient>
    <linearGradient id="stage" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <radialGradient id="glow1" cx="28%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="72%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#f97316" stop-opacity=".5"/>
      <stop offset="100%" stop-color="#f97316" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Background -->
  <rect width="100" height="100" rx="22" fill="url(#bg)"/>
  <!-- Spotlight beams -->
  <polygon points="22,14 34,14 58,70 46,70" fill="url(#glow1)"/>
  <polygon points="78,14 66,14 42,70 54,70" fill="url(#glow2)"/>
  <!-- Stage floor glow -->
  <ellipse cx="50" cy="78" rx="36" ry="5" fill="#a855f7" opacity=".2"/>
  <!-- Stage platform -->
  <rect x="10" y="70" width="80" height="11" rx="4" fill="url(#stage)"/>
  <!-- Stage front edge shine -->
  <rect x="10" y="70" width="80" height="2.5" rx="2" fill="#e9d5ff" opacity=".4"/>
  <!-- Left speaker -->
  <rect x="10" y="50" width="13" height="22" rx="3" fill="#222230"/>
  <rect x="12.5" y="52.5" width="8" height="7" rx="2" fill="#2c2c3a"/>
  <circle cx="16.5" cy="65" r="3.5" fill="#2c2c3a"/>
  <!-- Right speaker -->
  <rect x="77" y="50" width="13" height="22" rx="3" fill="#222230"/>
  <rect x="79.5" y="52.5" width="8" height="7" rx="2" fill="#2c2c3a"/>
  <circle cx="83.5" cy="65" r="3.5" fill="#2c2c3a"/>
  <!-- Mic stand -->
  <rect x="49" y="44" width="2" height="27" rx="1" fill="#3a3a4a"/>
  <path d="M44 60 Q44 68 50 68 Q56 68 56 60" fill="none" stroke="#5a5a6a" stroke-width="2"/>
  <rect x="46" y="68" width="8" height="2" rx="1" fill="#3a3a4a"/>
  <!-- Mic capsule -->
  <ellipse cx="50" cy="37" rx="6.5" ry="8.5" fill="#e2e8f0"/>
  <ellipse cx="50" cy="37" rx="4.5" ry="6.5" fill="#cbd5e1"/>
  <!-- Spotlight sources -->
  <circle cx="24" cy="13" r="5.5" fill="#7c3aed"/>
  <circle cx="24" cy="13" r="3" fill="#c084fc"/>
  <circle cx="76" cy="13" r="5.5" fill="#c2410c"/>
  <circle cx="76" cy="13" r="3" fill="#fb923c"/>
</svg>
